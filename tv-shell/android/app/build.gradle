plugins {
    id 'com.android.application'
}

def ffmpegBuildScript = rootProject.file('../scripts/build-media3-ffmpeg.sh')
def ffmpegOutput = layout.buildDirectory.dir('generated/media3Ffmpeg')
// The Media3 FFmpeg audio extension (AC-3) is built by a bash script that needs Linux or macOS.
// -Ptvshell.media3Ffmpeg (or gradle.properties): unset builds it, except on Windows, where the
// build continues without it and warns; "off" leaves it out (Media3 then plays without the AC-3
// fallback); a directory uses a previous output of the script (java/, jniLibs/, assets/), for
// example one built in WSL or downloaded from CI.
def ffmpegSetting = (findProperty('tvshell.media3Ffmpeg') ?: '').toString().trim()
def onWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
if (ffmpegSetting.isEmpty() && onWindows) {
    logger.warn('tv-shell: the Media3 FFmpeg (AC-3) build needs Linux or macOS, so this APK has no '
        + 'AC-3 fallback. Pass -Ptvshell.media3Ffmpeg=<dir> to use a prebuilt output, or =off to '
        + 'silence this warning.')
}
def ffmpegMode = ffmpegSetting.isEmpty() ? (onWindows ? 'off' : 'build') : ffmpegSetting
def ffmpegRoot = null
if (ffmpegMode == 'build') {
    ffmpegRoot = ffmpegOutput.get().asFile
} else if (ffmpegMode != 'off') {
    ffmpegRoot = file(ffmpegMode)
    def jni = new File(ffmpegRoot, 'jniLibs')
    def built = jni.isDirectory() && jni.listFiles().any { new File(it, 'libffmpegJNI.so').isFile() }
    if (!built || !new File(ffmpegRoot, 'java').isDirectory()) {
        throw new GradleException("tvshell.media3Ffmpeg: ${ffmpegRoot} is not an output of "
            + 'scripts/build-media3-ffmpeg.sh (expected java/ and jniLibs/<abi>/libffmpegJNI.so). '
            + 'Use "off" to build without the AC-3 fallback.')
    }
}
// Plain directories, so a product flavor can move them to its own source set.
ext.media3FfmpegDirs = ffmpegRoot == null ? [:] : [
    java: new File(ffmpegRoot, 'java'),
    jniLibs: new File(ffmpegRoot, 'jniLibs'),
    assets: new File(ffmpegRoot, 'assets'),
]

android {
    namespace 'org.tvshell.iptvnator'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.tvshell.iptvnator'
        minSdk 25          // Fire OS 6 (Android 7.1) and newer
        targetSdk 35
        // CI derives this from the commit time (minutes since the epoch) so every published
        // APK upgrades the previous one, whichever repository built it. Local builds: 1.
        versionCode = Integer.parseInt(System.getenv('TVSHELL_VERSION_CODE') ?: '1')
        versionName '0.1.0'
    }

    // Optional release signing: set the four TVSHELL_* environment variables
    // (the GitHub workflow fills them from repository secrets). Without them
    // the release build is signed with the versioned debug key: still a
    // non-debuggable APK, and it installs over earlier builds (same signer).
    def keystorePath = System.getenv('TVSHELL_KEYSTORE_PATH')
    def hasReleaseKeystore = keystorePath != null && file(keystorePath).exists()
    signingConfigs {
        // The versioned debug key (conventional, not secret) replaces the
        // auto-generated one: CI runners are ephemeral, and a different signer
        // on every build would make Android refuse to install a new APK over
        // the previous one.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('TVSHELL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TVSHELL_KEY_ALIAS')
                keyPassword System.getenv('TVSHELL_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    if (media3FfmpegDirs) {
        sourceSets.main {
            java.srcDir media3FfmpegDirs.java
            jniLibs.srcDir media3FfmpegDirs.jniLibs
            assets.srcDir media3FfmpegDirs.assets
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    // The Angular bundle is copied to src/main/assets/www by the build
    // workflow (or by hand); keep it uncompressed so it is served straight
    // from the APK without extraction overhead.
    androidResources {
        noCompress 'js', 'css', 'json', 'woff', 'woff2', 'html', 'webmanifest', 'svg'
    }
}

tasks.register('buildMedia3Ffmpeg', Exec) {
    inputs.file ffmpegBuildScript
    inputs.property 'ndkVersion', android.ndkVersion
    inputs.property 'minSdk', android.defaultConfig.minSdk
    outputs.dir ffmpegOutput
    doFirst {
        commandLine 'bash', ffmpegBuildScript, android.ndkDirectory, android.defaultConfig.minSdk,
            ffmpegOutput.get().asFile
    }
}
if (ffmpegMode == 'build') tasks.named('preBuild').configure { dependsOn 'buildMedia3Ffmpeg' }

dependencies {
    implementation project(':backend')
    implementation 'androidx.webkit:webkit:1.13.0'
    compileOnly 'org.checkerframework:checker-qual:3.13.0' // Media3 FFmpeg annotations
    def media3Version = '1.11.1' // Keep the FFmpeg extension source revision in sync.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    // Last published NanoHTTPD. Known advisories do not apply: CVE-2020-13697 is in
    // RouterNanoHTTPD (nanolets, not used); CVE-2022-21230 concerns temp files in a shared
    // java.io.tmpdir, which on Android is the app-private cache dir. Request bodies are
    // capped in TvShellServer before NanoHTTPD parses them.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
